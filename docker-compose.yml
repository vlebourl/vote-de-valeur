services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vote
      POSTGRES_PASSWORD: vote
      POSTGRES_DB: vote_de_valeur
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vote -d vote_de_valeur"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      BASE_URL: ${BASE_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-secret-change-me}
      EMAIL_HASH_SECRET: ${EMAIL_HASH_SECRET:-dev-insecure-email-secret-change-me}
      DATABASE_URL: postgres://vote:vote@db:5432/vote_de_valeur
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Vote de valeur <noreply@example.com>}
      SMTP_DEV_MODE: ${SMTP_DEV_MODE:-true}
    ports:
      - "3000:3000"

volumes:
  db_data:
